name: Apply Supabase migrations

on:
  push:
    branches:
      - feat/supabase-monorepo
      - main
    paths:
      - supabase/migrations/**

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Validate migration settings
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SYSTEM_ADMIN_EMAIL: ${{ vars.SYSTEM_ADMIN_EMAIL }}
          SYSTEM_ADMIN_DISPLAY_NAME: ${{ vars.SYSTEM_ADMIN_DISPLAY_NAME }}
        run: |
          for name in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD SUPABASE_DB_URL \
            SUPABASE_PROJECT_ID SYSTEM_ADMIN_EMAIL SYSTEM_ADMIN_DISPLAY_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in this GitHub environment."
              exit 1
            fi
          done

      - name: Link Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID" --yes

      - name: Apply migrations in order
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: supabase db push --remote --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Bootstrap system administrator
        env:
          SYSTEM_ADMIN_EMAIL: ${{ vars.SYSTEM_ADMIN_EMAIL }}
          SYSTEM_ADMIN_DISPLAY_NAME: ${{ vars.SYSTEM_ADMIN_DISPLAY_NAME }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "$SUPABASE_DB_URL" \
            --set ON_ERROR_STOP=1 \
            --set "admin_email=$SYSTEM_ADMIN_EMAIL" \
            --set "admin_name=$SYSTEM_ADMIN_DISPLAY_NAME" \
            --file supabase/bootstrap-system-admin.sql
