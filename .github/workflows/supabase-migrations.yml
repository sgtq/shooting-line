name: Apply Supabase migrations

on:
  push:
    branches:
      - develop
      - main
    paths:
      - supabase/migrations/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-migrations-${{ github.ref }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'development' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - uses: ./.github/actions/setup-supabase-cli

      - name: Validate migration settings
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SYSTEM_ADMIN_EMAIL: ${{ vars.SYSTEM_ADMIN_EMAIL }}
          SYSTEM_ADMIN_DISPLAY_NAME: ${{ vars.SYSTEM_ADMIN_DISPLAY_NAME }}
        run: |
          for name in SUPABASE_DB_URL SUPABASE_PROJECT_ID SYSTEM_ADMIN_EMAIL SYSTEM_ADMIN_DISPLAY_NAME; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure $name in this GitHub environment."
              exit 1
            fi
          done
          case "$SUPABASE_DB_URL" in
            *"@db."*)
              echo "::error::Use the project's Session pooler URI; direct database hosts may be IPv6-only."
              exit 1
              ;;
          esac
          case "$SUPABASE_DB_URL" in
            *"$SUPABASE_PROJECT_ID"*) ;;
            *)
              echo "::error::SUPABASE_DB_URL does not appear to belong to SUPABASE_PROJECT_ID."
              exit 1
              ;;
          esac

      - name: Apply migrations in order
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        # --include-all applies files dated before the newest remote migration. Without it, a migration merged
        # out of order is skipped and the whole push fails.
        run: supabase db push --remote="$SUPABASE_DB_URL" --include-all --yes

      - name: Bootstrap system administrator
        env:
          SYSTEM_ADMIN_EMAIL: ${{ vars.SYSTEM_ADMIN_EMAIL }}
          SYSTEM_ADMIN_DISPLAY_NAME: ${{ vars.SYSTEM_ADMIN_DISPLAY_NAME }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          psql "$SUPABASE_DB_URL" \
            --set ON_ERROR_STOP=1 \
            --set "admin_email=$SYSTEM_ADMIN_EMAIL" \
            --set "admin_name=$SYSTEM_ADMIN_DISPLAY_NAME" \
            --file supabase/bootstrap-system-admin.sql

      # Development only. The script also checks the development URL against the project id and the production
      # URL, so a mix-up in secrets stops the run instead of seeding the wrong project.
      - name: Seed development test users
        if: github.ref_name == 'develop'
        env:
          PAGES_DEV_SUPABASE_URL: ${{ vars.PAGES_DEV_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEED_USER_PASSWORD: ${{ secrets.SEED_USER_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          PAGES_PRD_SUPABASE_URL: ${{ vars.PAGES_PRD_SUPABASE_URL }}
        run: |
          npm ci
          node scripts/dev-seed/cli.js seed
