name: Database tests

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: database-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pgtap:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up the Supabase CLI
        uses: ./.github/actions/setup-supabase-cli

      # Starting the stack applies every migration to a fresh database, which is the state the tests expect.
      - name: Start the local Supabase stack
        run: supabase start

      - name: Run the pgTAP tests
        run: supabase test db
