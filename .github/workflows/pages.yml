name: Deploy ShootingLine to GitHub Pages

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-production:
    runs-on: ubuntu-latest
    steps:
      - name: Check out production
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate production Supabase settings
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure VITE_$name as a repository Actions variable."
              exit 1
            fi
          done
      - name: Build production site
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: ${{ vars.VITE_BASE_PATH }}
          VITE_APP_ENV: production
      - name: Upload production site
        uses: actions/upload-artifact@v4
        with:
          name: site-production
          path: dist
          if-no-files-found: error

  build-develop:
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop
        uses: actions/checkout@v4
        with:
          ref: develop
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate development Supabase settings
        env:
          SUPABASE_URL: ${{ vars.PAGES_DEVELOPMENT_SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.PAGES_DEVELOPMENT_SUPABASE_PUBLISHABLE_KEY }}
        run: |
          for name in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Configure PAGES_DEVELOPMENT_$name as a repository Actions variable."
              exit 1
            fi
          done
      - name: Build development preview
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.PAGES_DEVELOPMENT_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.PAGES_DEVELOPMENT_SUPABASE_PUBLISHABLE_KEY }}
          VITE_BASE_PATH: ${{ vars.PAGES_DEVELOPMENT_BASE_PATH || format('/{0}/develop/', github.event.repository.name) }}
          VITE_APP_ENV: development
      - name: Upload development preview
        uses: actions/upload-artifact@v4
        with:
          name: site-develop
          path: dist
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs:
      - build-production
      - build-develop
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download production site
        uses: actions/download-artifact@v4
        with:
          name: site-production
          path: _site
      - name: Download development preview
        uses: actions/download-artifact@v4
        with:
          name: site-develop
          path: _site/develop
      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
